name: Bug
description: Tremor crashed, hung, or exited with code 2 when it shouldn't have.
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      render: bash
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and error
      render: text
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build tool
      options: [Maven, Gradle (Groovy DSL), Gradle (Kotlin DSL), Other]
  - type: input
    id: env
    attributes:
      label: Tremor version, Java version, OS
      placeholder: tremor 0.1.0, Java 21, Ubuntu 24.04
